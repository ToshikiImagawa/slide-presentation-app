name: macOS Signing Test

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/macos-signing-test.yml'
      - '.github/scripts/verify-codesign-authority.sh'
  workflow_dispatch:

concurrency:
  group: macos-signing-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-signing:
    name: Verify macOS code signing
    runs-on: macos-latest
    timeout-minutes: 40
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - run: npm ci
      - name: Set up macOS signing keychain (self-signed)
        # release.yml の同名ステップと完全同一の手順にすること。
        # release.yml 側を変更した場合は必ずこちらも追随させ、同期を保つこと(#27)。
        # このワークフローは署名回帰の検出が目的のため、release.yml の
        # HAS_APPLE_CERT による ad-hoc 縮退分岐は持たず、secrets 未設定時は
        # そのままハード失敗させる
        env:
          MACOS_SIGNING_P12: ${{ secrets.APPLE_CERTIFICATE }}
          MACOS_SIGNING_P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/macos-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERTIFICATE_PATH="$RUNNER_TEMP/apple-certificate.p12"
          CERTIFICATE_PEM_PATH="$RUNNER_TEMP/apple-certificate.pem"

          echo "$MACOS_SIGNING_P12" | base64 --decode -o "$CERTIFICATE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$MACOS_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed 's/"//g')

          # 自己署名ルート証明書を System keychain の信頼設定に追加する(CSSMERR_TP_NOT_TRUSTED 対策)。
          # /usr/bin/openssl で明示的にパスを指定すること。PATH 解決に任せると
          # macOS runner では Homebrew 製の OpenSSL 3.x が先に見つかり、macOS が p12 書き出しに
          # 使う legacy 暗号方式(RC2-40-CBC 等)をエラーも出さずに復号できず空の PEM を生成する。
          # macOS 標準の /usr/bin/openssl(LibreSSL)は legacy 形式をそのまま扱えるため確実
          /usr/bin/openssl pkcs12 -in "$CERTIFICATE_PATH" -clcerts -nokeys -passin "pass:$MACOS_SIGNING_P12_PASSWORD" -out "$CERTIFICATE_PEM_PATH"
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain "$CERTIFICATE_PEM_PATH"

          rm -f "$CERTIFICATE_PATH" "$CERTIFICATE_PEM_PATH"
      - name: Smoke test codesign identity resolution
        run: |
          SMOKE_BIN="$RUNNER_TEMP/codesign-smoke-test"
          cp /bin/ls "$SMOKE_BIN"
          codesign --sign "$APPLE_SIGNING_IDENTITY" --force "$SMOKE_BIN"
          codesign --verify "$SMOKE_BIN"
          .github/scripts/verify-codesign-authority.sh "$SMOKE_BIN" "$APPLE_SIGNING_IDENTITY"
      - name: Build app bundle (release.yml と同一 env)
        run: npm run tauri:build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      - name: Verify built app code signing
        run: |
          APP_PATH="$(find src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          .github/scripts/verify-codesign-authority.sh "$APP_PATH" "$APPLE_SIGNING_IDENTITY"
