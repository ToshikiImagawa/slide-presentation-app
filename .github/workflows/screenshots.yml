name: Update Screenshots

# README 用スクリーンショットを WebKit で撮影し、差分があればコミットする。
# 日本語フォント・WebKit 描画差のため macOS ランナー固定（Linux では豆腐化・見た目差が出る）。
# 撮影は e2e スモークを兼ねており、いずれかのシナリオが失敗するとジョブも失敗する（自己検証。md5重複・assert。#125）。
# `keys` 指定時（部分撮影）は、その意図した範囲だけが変化したかを screenshots:diff で確認し、
# 想定外の変化（写り込み事故等）があればジョブを失敗させる（#125 Phase2）。
# `keys` 未指定（全シナリオ再撮影）時は比較対象が無いためスキップする。
on:
  workflow_dispatch:
    inputs:
      keys:
        description: '撮影するシナリオキー（スペース区切り。空なら全シナリオ）'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-screenshots:
    name: Update Screenshots (macOS)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SCREENSHOT_KEYS: ${{ github.event.inputs.keys }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright WebKit
        run: npx playwright install webkit
      - name: Generate screenshots
        run: npm run generate-screenshots -- $SCREENSHOT_KEYS
      - name: Diff report (regression self-check)
        if: ${{ github.event.inputs.keys != '' }}
        run: npm run screenshots:diff -- --expect "$(echo "$SCREENSHOT_KEYS" | tr -s ' ' ',')"
      - name: Commit screenshots if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain resources/screenshots/)" ]; then
            git add resources/screenshots/
            git commit -m "[update] README スクリーンショットを更新"
            git push
          else
            echo "スクリーンショットに差分はありません。コミットをスキップします。"
          fi
