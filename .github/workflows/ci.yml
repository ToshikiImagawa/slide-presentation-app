name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.sdd/**'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.sdd/**'
      - '.claude/**'
      - 'LICENSE'
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run test

  samples:
    name: Sample Packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # 配布サンプルが .spkg として書き出せることを検証する（--strict なので参照アセットの欠損で失敗する）。
      # リリース時に初めて壊れていることに気づく事態を防ぐゲート
      - run: npm run export:samples
      - name: Check exported assets
        run: |
          set -euo pipefail
          for name in $(node -e "console.log(require('./samples/manifest.json').packages.map((p) => p.name).join(' '))"); do
            test -f "dist-slides/$name.spkg" || { echo "::error::dist-slides/$name.spkg が生成されていません"; exit 1; }
          done

  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # cargo clippy/test は lib（tauri 依存）をフルコンパイルするため Tauri の system deps が必要。
      # ubuntu-latest では needrestart の対話プロンプトで apt が固まることがあるため、
      # DEBIAN_FRONTEND=noninteractive と NEEDRESTART_MODE=a で完全に非対話化する。
      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev pkg-config libsoup-3.0-dev
      - name: Format (check)
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Clippy (deny warnings)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # e2e はテキスト内容ベースの検証なので WebKit を Linux で実行できる（フォント描画に非依存）
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      - name: Run E2E tests
        run: npm run test:e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  visual-check:
    name: Visual Check (reference deck)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      # fixture と resources/reference-deck/ のファイル名照合。撮影もフォント描画も不要なため、
      # WebKit 起動前に実行して孤児・欠落を早期に検知する（#293）
      - name: Check reference deck file names
        run: npm run reference-deck:check-files
      # はみ出し・セーフエリア侵入・マスター装飾との重なりは DOM 実測（getBoundingClientRect）で判定するため、
      # ピクセル比較（reference-deck:diff）と違い撮影の非決定性の影響を受けず、フォント描画差にも依存しない。
      # e2e ジョブと同様に WebKit を Linux で実行できる（#209）
      - name: Install Playwright WebKit
        run: npx playwright install --with-deps webkit
      # #297 の再発確認用: Linux CI 上で 10 回連続実行して警告 0 件が続くことを確認する一時的なループ。
      # 確認後にこのループを外す（恒久化しない）
      - name: Inspect reference deck (x10, #297 flake check)
        run: |
          for i in $(seq 1 10); do
            echo "=== run $i ==="
            npm run reference-deck:inspect
          done

  build:
    name: Build (frontend)
    needs: [quality, test, rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
