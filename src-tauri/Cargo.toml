[package]
name = "app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# preserve_order: オブジェクトのキーを挿入順で保持し、extract_asset_paths のアセット走査順を
# JS(export-slides.mjs の Object.values=挿入順) と一致させる（DC-003・lib.rs のコメント「出現順を保持」を実挙動と整合）
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2.4.3"
flate2 = "1.1.9"
tar = "0.4.46"
# AI スライド生成（#14・Phase 2 以降で使用）:
# HTTP は Rust 境界へ集約しキーを WebView に出さない（DC-002/NFR-003）。rustls-tls で OpenSSL 非依存。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# API キーは OS キーチェーン（keyring）に保管。各 native feature は対象 OS のみ有効化される
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
# 復号後のキーを平文 String で持ち回らずログ/Debug に出さない（NFR-003/NFR-004）
secrecy = "0.10"
# 生成器 trait を async 化する（SlideGenerator::generate）
async-trait = "0.1"
# 応答タイムアウト（NFR-005）・外部 CLI サブプロセス実行・trait の async テスト（#[tokio::test]）に使用
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "rt"] }
# API キー登録メタデータの last_updated（RFC3339）生成。Cargo.lock に transitive で既存（追加コスト小）
time = { version = "0.3", features = ["formatting"] }
