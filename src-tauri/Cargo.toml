[package]
name = "app"
version = "2.3.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
# OOXML ブランド抽出（#167）で直接依存へ昇格した zip 4.x が 1.82 を要求する（quick-xml 0.41 も 1.79 を要求するため、
# tauri 由来の 1.77.2 は元より維持できない）。信頼できない zip を読む以上、脆弱性修正を受け取れる最新系を使う方を優先する
rust-version = "1.82.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
# preserve_order: オブジェクトのキーを挿入順で保持し、extract_asset_paths のアセット走査順を
# JS(export-slides.mjs の Object.values=挿入順) と一致させる（DC-003・lib.rs のコメント「出現順を保持」を実挙動と整合）
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-store = "2.4.3"
tauri-plugin-updater = "2.10.1"
# .spkg 関連付け（#104）: OS から2重起動されたときも既存ウィンドウで開き直すため、argv を単一インスタンスへ転送する
tauri-plugin-single-instance = "2.4.3"
flate2 = "1.1.9"
tar = "0.4.46"
# AI スライド生成（#14）:
# HTTP は Rust 境界へ集約しトークン/認証を WebView に出さない（DC-002/NFR-003）。rustls-tls で OpenSSL 非依存。
# 内蔵は Vertex AI（GCP ADC）直・外部 CLI 実行の両経路で使用（Vertex トークン交換の form POST も reqwest）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
# 生成器 trait を async 化する（SlideGenerator::generate）
async-trait = "0.1"
# 応答タイムアウト（NFR-005）・外部 CLI サブプロセス実行・ADC ファイル読取（fs）・トークンキャッシュ（sync::Mutex）・
# trait の async テスト（#[tokio::test]）に使用
tokio = { version = "1", features = ["time", "process", "io-util", "macros", "rt", "fs", "sync"] }
# 自動アップデート（#121）: GitHub API で解決した latest.json アセット URL を updater の endpoints に渡す
url = "2"
# OOXML ブランド抽出（#167）: .pptx/.potx/.thmx を OPC（zip）として読む。
# deflate バックエンドを既存の直接依存 flate2 に固定し、bzip2/zstd/lzma/AES 等のネイティブ依存を持ち込まない
# （プラットフォームごとのビルド条件を増やさない）。.spkg の tar+gzip 展開とは別経路（brand/opc.rs 参照）
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
# OOXML の pull パーサ。DOM を組まずストリームで読み、巨大 XML でもメモリ上限内に収める
quick-xml = "0.41"
# ブランド抽出の並置比較ダイアログ（#168）: サムネイル・ロゴ候補の画像バイト列を IPC の JSON へ載せるため base64 化する
base64 = "0.22"
# 同一テンプレートの再取り込みで人の上書きを引き継ぐためのキー（#168）。ファイル内容から決定的に導出する
sha2 = "0.10"
